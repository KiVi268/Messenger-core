[workspace]
resolver = "3"
members = ["crates/kivi-crypto", "crates/kivi-ffi", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/KiVi268/Messenger-core"
publish = false

[workspace.dependencies]
kivi-crypto = { path = "crates/kivi-crypto" }

# libsignal не публикуется на crates.io — подключаем по тегу релиза.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.103.1" }

futures-util = "0.3"
prost = "0.14"
rand = "0.9"
thiserror = "2"
uniffi = "0.29"
uuid = "1"

# Только для тестов: подпись сертификатов sealed sender «как на сервере».
curve25519-dalek = "5"
ed25519-dalek = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Размер нативной библиотеки в APK/IPA.
lto = true
codegen-units = 1
strip = true
